<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Hyrje')}"></head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 380px">
    <h1 class="h4 text-center mb-4 fw-bold"><img class="d-block mx-auto mb-2" th:src="@{/favicon.svg}" alt="" width="56" height="56">PC<span class="text-warning">Mania</span> admin</h1>
    <div th:if="${param.error}" class="alert alert-danger">Emri ose fjalëkalimi është i gabuar.</div>
    <div th:if="${param.locked}" class="alert alert-danger">Shumë tentativa të dështuara. Provoni pas 15 minutash.</div>
    <div th:if="${param.logout}" class="alert alert-success">Dolët nga llogaria.</div>
    <form th:action="@{/admin/login}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label class="form-label" for="username">Përdoruesi</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Fjalëkalimi</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-dark w-100" type="submit">Hyr</button>
    </form>
</main>
</body>
</html>
