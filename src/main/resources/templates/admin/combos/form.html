<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${combo == null} ? 'Paketë e re' : ${combo.titleSq})}"></head>
<body>
<nav th:replace="~{admin/fragments :: nav('combos')}"></nav>
<main class="container-xl py-3 pb-5">
    <div th:replace="~{admin/fragments :: flash}"></div>

    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <a href="/admin/combos" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
        <h1 class="h4 mb-0 me-auto" th:text="${combo == null} ? 'Paketë e re' : ${combo.titleSq}"></h1>
        <th:block th:if="${combo != null}">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/paketa/{s}(s=${combo.slug})}" target="_blank" rel="noopener"><i class="bi bi-eye"></i> Shiko</a>
            <form th:action="@{/admin/combos/{id}/delete(id=${combo.id})}" method="post" data-confirm="Të fshihet kjo paketë? Produktet nuk preken.">
                <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
            </form>
        </th:block>
    </div>

    <div th:if="${combo != null}" class="alert small" th:classappend="${visible} ? 'alert-success' : 'alert-warning'">
        <th:block th:if="${visible}"><i class="bi bi-eye me-1"></i>E dukshme në faqe.</th:block>
        <th:block th:unless="${visible}"><i class="bi bi-eye-slash me-1"></i>I fshehur: <span th:text="${#strings.listJoin(reasons, '; ')}"></span></th:block>
    </div>

    <form th:action="${combo == null} ? @{/admin/combos} : @{/admin/combos/{id}(id=${combo.id})}" method="post" id="comboForm">
        <div class="row g-3">
            <div class="col-lg-7">
                <div class="card card-body mb-3">
                    <div class="mb-3">
                        <label class="form-label" for="titleSq">Titulli *</label>
                        <input class="form-control" id="titleSq" name="titleSq" th:value="${form.titleSq}" required maxlength="200" placeholder="p.sh. RTX 3060 + Ryzen 5 5600">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="subtitleSq">Nëntitulli</label>
                        <input class="form-control" id="subtitleSq" name="subtitleSq" th:value="${form.subtitleSq}" maxlength="300" placeholder="p.sh. Bazë e fortë për lojëra në 1080p">
                    </div>
                    <label class="form-label">Produktet *</label>
                    <div id="comboLines">
                        <div class="combo-line" th:each="l : ${form.items}">
                            <select class="form-select form-select-sm" name="productId" aria-label="Produkti">
                                <option value="">— zgjidhni produktin —</option>
                                <option th:each="p : ${products}" th:value="${p.id}" th:attr="data-price=${p.priceLek}"
                                        th:selected="${p.id == l.productId}"
                                        th:text="${p.title} + ' · ' + ${@fmt.price(p.priceLek)} + (${p.status.name() != 'ACTIVE'} ? ' (' + ${p.status.label} + ')' : '')"></option>
                            </select>
                            <input class="form-control form-control-sm" type="number" name="quantity" min="1" th:value="${l.quantity}" aria-label="Sasia">
                            <button class="btn btn-sm btn-outline-danger line-del" type="button" aria-label="Hiq"><i class="bi bi-x"></i></button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-primary align-self-start" id="addLine"><i class="bi bi-plus"></i> Shto produkt</button>
                    <div class="form-text">Paketa nuk kopjon emrin, çmimin apo fotot: lexohen gjithmonë nga produkti. Produktet e shitura nuk shfaqen në listë.</div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card card-body mb-3">
                    <div class="mb-2 small">Veç e veç: <strong id="originalTotal">—</strong></div>
                    <div class="mb-3">
                        <label class="form-label" for="comboPriceLek">Çmimi i paketës (Lekë) *</label>
                        <input class="form-control" type="number" min="1" step="1" id="comboPriceLek" name="comboPriceLek" th:value="${form.comboPriceLek}" required>
                        <div class="small mt-1" id="savingsInfo"></div>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="active" name="active" value="true" th:checked="${form.active}">
                        <label class="form-check-label" for="active">Aktive</label>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small mb-0" for="startsAt">Fillon</label>
                            <input class="form-control form-control-sm" type="datetime-local" id="startsAt" name="startsAt" th:value="${form.startsAt != null} ? ${#temporals.format(form.startsAt, 'yyyy-MM-dd''T''HH:mm')} : ''">
                        </div>
                        <div class="col-6">
                            <label class="form-label small mb-0" for="endsAt">Mbaron</label>
                            <input class="form-control form-control-sm" type="datetime-local" id="endsAt" name="endsAt" th:value="${form.endsAt != null} ? ${#temporals.format(form.endsAt, 'yyyy-MM-dd''T''HH:mm')} : ''">
                        </div>
                        <div class="col-12 form-text mt-0">Bosh = pa afat.</div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label small mb-0" for="sortOrder">Rendi</label>
                            <input class="form-control form-control-sm" type="number" id="sortOrder" name="sortOrder" th:value="${form.sortOrder}">
                        </div>
                        <div class="col-6">
                            <label class="form-label small mb-0" for="slug">Adresa (slug)</label>
                            <input class="form-control form-control-sm font-monospace" id="slug" name="slug" th:value="${form.slug}" placeholder="nga titulli">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="save-bar">
            <div class="container-xl d-flex gap-2 justify-content-end">
                <a href="/admin/combos" class="btn btn-outline-secondary">Anulo</a>
                <button class="btn btn-primary px-4" type="submit"><i class="bi bi-check-lg"></i> Ruaj</button>
            </div>
        </div>
    </form>
</main>
<th:block th:replace="~{admin/fragments :: scripts}"></th:block>
<script>
    (() => {
        const lines = document.getElementById('comboLines');
        const price = document.getElementById('comboPriceLek');
        const fmt = n => n.toLocaleString('de-DE') + ' Lekë';
        const update = () => {
            let total = 0;
            lines.querySelectorAll('.combo-line').forEach(l => {
                const opt = l.querySelector('select').selectedOptions[0];
                total += (+opt?.dataset.price || 0) * Math.max(1, +l.querySelector('input').value || 1);
            });
            document.getElementById('originalTotal').textContent = total ? fmt(total) : '—';
            const info = document.getElementById('savingsInfo');
            const p = +price.value;
            if (!total || !p) { info.textContent = ''; return; }
            info.className = 'small mt-1 ' + (p < total ? 'text-success' : 'text-danger');
            info.textContent = p < total ? 'Klienti kursen ' + fmt(total - p) : 'Duhet të jetë më pak se ' + fmt(total);
        };
        document.getElementById('addLine').addEventListener('click', () => {
            const first = lines.querySelector('.combo-line');
            const row = first.cloneNode(true);
            row.querySelector('select').value = '';
            row.querySelector('input').value = 1;
            lines.appendChild(row);
            update();
        });
        lines.addEventListener('click', e => {
            if (!e.target.closest('.line-del')) return;
            if (lines.querySelectorAll('.combo-line').length > 1) e.target.closest('.combo-line').remove();
            else e.target.closest('.combo-line').querySelector('select').value = '';
            update();
        });
        lines.addEventListener('change', update);
        lines.addEventListener('input', update);
        price.addEventListener('input', update);
        update();
    })();
</script>
</body>
</html>
