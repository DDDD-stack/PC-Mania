<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Kontaktet nga asistenti')}"></head>
<body>
<nav th:replace="~{admin/fragments :: nav('chat')}"></nav>
<main class="container-fluid py-3">
    <div th:replace="~{admin/fragments :: flash}"></div>
    <div class="d-flex flex-wrap gap-2 align-items-center mb-1">
        <a href="/admin/chat" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
        <h1 class="h4 mb-0">Kontaktet për t'u telefonuar</h1>
    </div>
    <p class="text-body-secondary small mb-3">Klientë që asistenti nuk i shërbeu dot nga stoku dhe lanë emrin e telefonin. Telefonojini dhe shënoni statusin.</p>

    <ul class="nav nav-pills flex-nowrap overflow-auto mb-3 small">
        <li class="nav-item"><a class="nav-link text-nowrap" th:classappend="${status == null} ? active" href="/admin/chat/leads">Të gjitha</a></li>
        <li class="nav-item" th:each="s : ${leadStatuses}">
            <a class="nav-link text-nowrap" th:classappend="${s == status} ? active" th:href="@{/admin/chat/leads(status=${s})}">
                <span th:text="${s.label}"></span> <span class="badge text-bg-secondary" th:text="${counts.get(s)}"></span>
            </a>
        </li>
    </ul>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white">
            <thead class="table-light">
            <tr><th>Data</th><th>Kërkon</th><th class="text-end">Buxheti</th><th class="text-end">PSU</th><th>Klienti</th><th>Statusi</th></tr>
            </thead>
            <tbody>
            <tr th:each="l : ${page.content}">
                <td class="text-nowrap small"><a th:href="@{/admin/chat/leads/{id}(id=${l.id})}" th:text="${@fmt.dateTime(l.createdAt)}"></a></td>
                <td><a class="text-decoration-none fw-semibold" th:href="@{/admin/chat/leads/{id}(id=${l.id})}" th:text="${l.wantedItem}"></a></td>
                <td class="text-end text-nowrap" th:text="${l.budgetLek != null} ? ${@fmt.price(l.budgetLek)} : '—'"></td>
                <td class="text-end text-nowrap" th:text="${l.psuWatts != null} ? ${l.psuWatts} + ' W' : '—'"></td>
                <td><span th:text="${l.name}"></span><div class="small text-body-secondary" th:text="${l.phone}"></div></td>
                <td><span class="badge" th:classappend="'status-' + ${l.status}" th:text="${l.status.label}"></span></td>
            </tr>
            <tr th:if="${page.empty}"><td colspan="6" class="text-center text-body-secondary py-4">Ende asnjë kontakt.</td></tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${page.totalPages > 1}">
        <ul class="pagination pagination-sm">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? active">
                <a class="page-link" th:href="@{/admin/chat/leads(status=${status}, page=${i})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</main>
<th:block th:replace="~{admin/fragments :: scripts}"></th:block>
</body>
</html>
