<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Bisedë')}"></head>
<body>
<nav th:replace="~{admin/fragments :: nav('chat')}"></nav>
<main class="container py-3" style="max-width: 900px">
    <div th:replace="~{admin/fragments :: flash}"></div>

    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <a href="/admin/chat" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
        <h1 class="h4 mb-0">Bisedë <span class="text-body-secondary">#<span th:text="${s.id}"></span></span></h1>
        <span class="text-body-secondary small ms-auto">
            <span th:text="${@fmt.dateTime(s.startedAt)}"></span> → <span th:text="${@fmt.dateTime(s.lastMessageAt)}"></span> ·
            <span th:text="${s.messageCount}"></span> mesazhe
        </span>
    </div>

    <div class="card mb-3" th:unless="${leads.empty}">
        <div class="card-header bg-success-subtle"><i class="bi bi-telephone me-1"></i><strong>Kontakte nga kjo bisedë</strong></div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex flex-wrap gap-2 align-items-center" th:each="l : ${leads}">
                <a th:href="@{/admin/chat/leads/{id}(id=${l.id})}" class="fw-semibold" th:text="${l.name}"></a>
                <span th:text="${l.phone}"></span> · kërkon <strong th:text="${l.wantedItem}"></strong>
                <span class="badge ms-auto" th:classappend="'status-' + ${l.status}" th:text="${l.status.label}"></span>
            </li>
        </ul>
    </div>

    <div class="d-flex flex-column gap-2">
        <div th:each="r : ${rows}" class="d-flex" th:classappend="${r.message.role.name() == 'USER'} ? 'justify-content-end' : 'justify-content-start'">
            <div class="card" style="max-width: 85%" th:classappend="${r.message.role.name() == 'USER'} ? 'text-bg-dark' : ''">
                <div class="card-body py-2 px-3">
                    <div class="small opacity-75 mb-1">
                        <span th:text="${r.message.role.name() == 'USER'} ? 'Klienti' : 'Asistenti'"></span>
                        <span th:if="${r.message.providerUsed}" th:text="'(' + ${r.message.providerUsed} + ')'"></span> · <span th:text="${@fmt.dateTime(r.message.createdAt)}"></span>
                    </div>
                    <div style="white-space: pre-wrap" th:text="${r.message.content}"></div>
                    <div class="mt-2 small" th:unless="${r.products.empty}">
                        <i class="bi bi-gpu-card me-1"></i>Tregoi:
                        <a th:each="p, st : ${r.products}" th:href="@{/admin/products/{id}(id=${p.id})}" th:text="${p.title} + (${st.last} ? '' : ', ')"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${rows.empty}" class="text-body-secondary">Biseda është bosh.</p>
</main>
<th:block th:replace="~{admin/fragments :: scripts}"></th:block>
</body>
</html>
