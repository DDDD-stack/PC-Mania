<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Kërkesë PC')}"></head>
<body>
<nav th:replace="~{admin/fragments :: nav('builds')}"></nav>
<main class="container py-3" style="max-width: 900px">
    <div th:replace="~{admin/fragments :: flash}"></div>

    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <a href="/admin/builds" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
        <h1 class="h4 mb-0" th:text="${b.customerName}"></h1>
        <span class="badge fs-6" th:classappend="'status-' + ${b.status}" th:text="${b.status.label}"></span>
        <span class="text-body-secondary small ms-auto" th:text="${@fmt.dateTime(b.createdAt)}"></span>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header"><strong>Kërkesa</strong></div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-5">Buxheti</dt><dd class="col-7 fw-bold" th:text="${@fmt.price(b.budgetLek)}"></dd>
                        <dt class="col-5">Përdorimi</dt><dd class="col-7" th:text="${b.useCase.label}"></dd>
                        <dt class="col-5">Telefoni</dt><dd class="col-7"><a th:href="'tel:' + ${b.customerPhone}" th:text="${b.customerPhone}"></a></dd>
                    </dl>
                    <div th:if="${b.notes}" class="mt-2">
                        <div class="text-body-secondary small">Shënime nga klienti</div>
                        <div style="white-space: pre-line" th:text="${b.notes}"></div>
                    </div>
                    <div class="d-flex gap-2 mt-3">
                        <a class="btn btn-sm btn-outline-dark" th:href="'tel:' + ${b.customerPhone}"><i class="bi bi-telephone"></i> Telefono</a>
                        <a class="btn btn-sm btn-success" th:href="${customerWhatsapp}" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i> WhatsApp</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <form class="card h-100" th:action="@{/admin/builds/{id}(id=${b.id})}" method="post">
                <div class="card-header"><strong>Oferta dhe statusi</strong></div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Totali i ofertës (Lekë)</label>
                        <input class="form-control" type="number" min="0" step="500" name="quotedTotalLek" th:value="${b.quotedTotalLek}">
                        <div class="form-text" th:if="${b.quotedTotalLek != null}"
                             th:text="'Diferenca nga buxheti: ' + ${@fmt.price(b.quotedTotalLek - b.budgetLek)}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Statusi</label>
                        <select class="form-select" name="status">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == b.status}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Shënime të brendshme <small class="text-body-secondary">(lista e pjesëve, kostot…)</small></label>
                        <textarea class="form-control" name="adminNotes" rows="6" th:text="${b.adminNotes}"></textarea>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Ruaj</button>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{admin/fragments :: scripts}"></th:block>
</body>
</html>
