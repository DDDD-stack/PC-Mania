<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · PCMania Admin'">Admin</title>
    <link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="nav(active)" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top admin-nav">
    <div class="container-fluid">
        <a class="navbar-brand brand fw-bold" href="/admin"><img class="brand-mark" th:src="@{/images/logo-mark.svg}" alt="" width="26" height="26"><span>PC<span class="text-warning">Mania</span> <small class="fw-normal opacity-75">admin</small></span></a>
        <a class="live-pill d-lg-none ms-auto me-2" href="/admin/orders?status=NEW" data-live-orders hidden>
            <i class="bi bi-bag-plus"></i> <span data-live-count></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-label="Menyja"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'dashboard'} ? active" href="/admin"><i class="bi bi-graph-up"></i> Paneli</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'products'} ? active" href="/admin/products"><i class="bi bi-gpu-card"></i> Produktet</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'categories'} ? active" href="/admin/categories"><i class="bi bi-tags"></i> Kategoritë</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'upcoming'} ? active" href="/admin/upcoming"><i class="bi bi-bell"></i> Së shpejti</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'app'} ? active" href="/admin/app"><i class="bi bi-android2"></i> Aplikacioni</a></li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'orders'} ? active" href="/admin/orders"><i class="bi bi-bag"></i> Porositë
                        <span class="badge rounded-pill text-bg-danger nav-count" data-live-orders hidden><span data-live-count></span></span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'builds'} ? active" href="/admin/builds"><i class="bi bi-tools"></i> Kërkesat PC
                        <span class="badge rounded-pill text-bg-warning nav-count" data-live-builds hidden><span data-live-build-count></span></span></a>
                </li>
            </ul>
            <a class="btn btn-sm btn-outline-light me-2" href="/" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Faqja</a>
            <form th:action="@{/admin/logout}" method="post" class="d-inline" data-no-loading>
                <button class="btn btn-sm btn-outline-warning" type="submit"><i class="bi bi-power"></i> Dil</button>
            </form>
        </div>
    </div>
</nav>

<!--/* Flash messages render as toasts: success fades out by itself, errors stay until closed. */-->
<div th:fragment="flash" class="toast-stack" aria-live="polite">
    <div th:if="${success}" class="pm-toast pm-toast-success" role="status" data-autohide>
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close btn-close-white" aria-label="Mbyll"></button>
    </div>
    <div th:if="${error}" class="pm-toast pm-toast-error" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close btn-close-white" aria-label="Mbyll"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('submit', e => {
            const msg = e.target.dataset.confirm;
            if (msg && !confirm(msg)) e.preventDefault();
        });
    </script>
    <script th:src="@{/js/admin.js}"></script>
</th:block>

</body>
</html>
