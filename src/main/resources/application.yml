spring:
  application:
    name: pcmania
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pcmania?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER:pcmania}
    password: ${DB_PASSWORD:pcmania}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 20
  flyway:
    locations: classpath:db/migration/{vendor}
    schemas: ${DB_SCHEMA:pcmania}
    enabled: true
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:60MB}
      max-request-size: ${MAX_REQUEST_SIZE:120MB}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  web:
    resources:
      static-locations: classpath:/static/
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 7d

server:
  port: ${PORT:8070}
  forward-headers-strategy: native
  compression:
    enabled: true
  servlet:
    session:
      timeout: 8h
      cookie:
        secure: ${COOKIE_SECURE:false}
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false

app:
  base-url: ${BASE_URL:http://localhost:8070}
  site-name: PCMania
  upload-dir: ${UPLOAD_DIR:./uploads}
  notify-email: ${NOTIFY_EMAIL:}
  mail-from: ${MAIL_FROM:no-reply@pcmania.al}
  whatsapp-number: ${WHATSAPP_NUMBER:355688343551}
  phone-display: ${PHONE_DISPLAY:+355 68 83 43 551}
  contact-email: ${CONTACT_EMAIL:drobi840@gmail.com}
  facebook-url: ${FACEBOOK_URL:https://www.facebook.com/}
  courier-shipping-lek: ${COURIER_SHIPPING_LEK:500}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  keep-awake:
    enabled: ${KEEP_AWAKE:true}
    from: ${KEEP_AWAKE_FROM:06:00}
    until: ${KEEP_AWAKE_UNTIL:01:00}
  mobile-api-key: ${MOBILE_API_KEY:}
  chat:
    provider: ${CHAT_PROVIDER:gemini}
    max-tokens: ${CHAT_MAX_TOKENS:4096}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-latest}
      requests-per-minute: ${GEMINI_RPM:12}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
      monthly-cap-usd: ${CHAT_MONTHLY_CAP_USD:25}
