spring:
  application:
    name: pcmania
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pcmania?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER:pcmania}
    password: ${DB_PASSWORD:pcmania}
    hikari:
      # Supabase allows a limited number of connections per project; a small pool is plenty
      # for one instance and leaves room for migrations and the SQL editor.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 20
  flyway:
    # {vendor} resolves to "mysql" or "postgresql" from the JDBC URL, so one build runs
    # against the local MySQL database and against Supabase without being rebuilt.
    locations: classpath:db/migration/{vendor}
    # On MySQL a schema is the database. On Postgres this keeps every table out of "public",
    # which is the only schema Supabase exposes through its public PostgREST API.
    schemas: ${DB_SCHEMA:pcmania}
    enabled: true
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      # The Android build is uploaded through this form too, and it is tens of megabytes.
      max-file-size: ${MAX_UPLOAD_SIZE:60MB}
      max-request-size: ${MAX_REQUEST_SIZE:120MB}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  web:
    resources:
      # Everything static is under /static. The default also searches three other folders, and with
      # the content strategy below every @{...} link on a page - product links included - is looked up
      # in each of them.
      static-locations: classpath:/static/
      # Links written as @{/css/site.css} come out as /css/site-<content hash>.css, so a deploy that
      # changes a stylesheet or script reaches every visitor at once instead of after the cache expires.
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 7d

server:
  port: ${PORT:8070}
  forward-headers-strategy: native
  compression:
    enabled: true
  servlet:
    session:
      timeout: 8h
      cookie:
        # Behind Render's TLS the admin session cookie must not be allowed to travel in
        # clear. Left off by default so plain-http local development keeps working.
        secure: ${COOKIE_SECURE:false}
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false

app:
  # Public absolute URL, used for canonical links, Open Graph and the sitemap.
  base-url: ${BASE_URL:http://localhost:8070}
  site-name: PCMania
  upload-dir: ${UPLOAD_DIR:./uploads}
  # Operator contact details
  notify-email: ${NOTIFY_EMAIL:}
  mail-from: ${MAIL_FROM:no-reply@pcmania.al}
  whatsapp-number: ${WHATSAPP_NUMBER:355688343551}
  phone-display: ${PHONE_DISPLAY:+355 68 83 43 551}
  contact-email: ${CONTACT_EMAIL:drobi840@gmail.com}
  facebook-url: ${FACEBOOK_URL:https://www.facebook.com/}
  courier-shipping-lek: ${COURIER_SHIPPING_LEK:500}
  # Created on first start if no admin exists. If password is blank a random one is printed to the log.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  # Render's free plan: keep the site awake between these times (Tirana time) and let it sleep
  # otherwise. 06:00-01:00 uses about 80% of the 750 free hours a month. See KeepAwake.
  keep-awake:
    enabled: ${KEEP_AWAKE:true}
    from: ${KEEP_AWAKE_FROM:06:00}
    until: ${KEEP_AWAKE_UNTIL:01:00}
  # The key built into the phone app, which then opens without a sign-in. At least 32 characters;
  # blank switches it off and the app has to sign in with the admin username and password instead.
  mobile-api-key: ${MOBILE_API_KEY:}
