# Render blueprint. Either commit this and use "New > Blueprint", or create the service
# by hand in the dashboard with runtime = Docker and set the same variables there.
#
# Secrets are marked "sync: false": Render asks for them once and stores them itself,
# so no password ends up in the repository.
services:
  - type: web
    name: pcmania
    runtime: docker
    # Frankfurt is the closest region to Albania.
    region: frankfurt
    # free = sleeps after 15 minutes of no traffic, and the next visitor waits while it starts.
    # It has no disk either, which no longer matters: photos and the app build live in the database.
    plan: free
    # Answers without touching the database (HealthController); "/" rendered the home page per poll.
    healthCheckPath: /healthz
    envVars:
      # --- required -------------------------------------------------------
      # The public https address Render gives the service. Canonical links, the sitemap,
      # Facebook preview images and the photo URLs the phone app loads all come from this.
      - key: BASE_URL
        sync: false
      # Supabase Postgres. Use the *pooler* connection string from Supabase > Project Settings >
      # Database, Session mode - the direct database host is IPv6-only, the pooler answers on IPv4:
      #   jdbc:postgresql://aws-1-<region>.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=pcmania
      # DB_USER is postgres.<project-ref>; DB_PASSWORD is the database password.
      # currentSchema is required: Flyway is told the schema by DB_SCHEMA, but Hibernate issues
      # unqualified SQL and will not find the tables without it.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Tables are created in this schema instead of "public". Supabase only exposes "public"
      # through its PostgREST API, so nothing here is reachable with the anon key.
      # See db/migration/postgresql/V6__supabase_hardening.sql.
      - key: DB_SCHEMA
        value: pcmania
      # Only used the first time, when the database has no admin yet.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # The key built into the phone app, which then opens without a sign-in (MobileAppKey).
      # Copy it from PC-Mania-Mobile/.env.local (EXPO_PUBLIC_API_KEY); the two must match.
      - key: MOBILE_API_KEY
        sync: false
      # The admin session cookie now crosses the public internet, so keep it https-only.
      - key: COOKIE_SECURE
        value: "true"

      # --- optional: the customer assistant ---------------------------------
      # Without the key the chat bubble is not shown at all. The key stays on the server.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Past this spend in a calendar month the bubble becomes the WhatsApp link until next month.
      - key: CHAT_MONTHLY_CAP_USD
        value: "25"

      # --- shop details ---------------------------------------------------
      - key: WHATSAPP_NUMBER
        sync: false
      - key: PHONE_DISPLAY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: FACEBOOK_URL
        sync: false
      - key: COURIER_SHIPPING_LEK
        value: "500"

      # --- optional: order notification e-mail ------------------------------
      # Without MAIL_HOST new orders are only written to the log.
      - key: NOTIFY_EMAIL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false

    # No disk is needed: product photos and the uploaded Android build are stored in the
    # database (stored_file), so they survive a deploy on the free plan too.
